<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Lucas Bar</title>
<style>
  /* ==========================================================================
     リキッドグラス v4（2026-08-06 全面書き直し・まひろ指示「完全に skill に従って」）
     設計の出典: emilkowalski/skills の apple-design（§12 Materials & depth ほか）と
     emil-design-eng（イージング・持続時間・パフォーマンス規約）。
     旧版（自前の feDisplacementMap 屈折＋R/Bプリズム＋手描きスペキュラ＋ノイズ）は
     全撤去した。skill のマテリアルの定義は「背後をぼかした半透明レイヤー＋
     光を受ける明るい上縁」であり、屈折レンズではないため。
     ------------------------------------------------------------------------
     ・材質は backdrop-filter: blur() + saturate()（skill の指定そのもの）。
       背後画素は python の背後サンプラが敷く #backdrop（窓と1:1）。
     ・暗いマテリアルを選ぶ = skill「darker/heavier materials separate structural
       regions」。バーは任意のデスクトップの上に浮く構造物なので暗側が正しい。
     ・大きい面ほど厚く: パネル(308px)は blur 22px、小さいタイル(116px)は 14px。
     ・ぼかしは 20px 未満に保つ（emil: heavy blur is expensive）。
     ========================================================================== */
  :root {
    --text: #eaf0ff;
    --text-dim: #93a0c8;
    --accent: #565f89;
    --radius: 16px;   /* SetWindowRgn の角丸（CORNER_CSS=32 直径）と一致させること */

    /* --- マテリアル（味の調整はここだけで済む） --- */
    /* 透明度の方針（2026-08-06 まひろ指示）: バーは**ほぼクリア**。ぼかしで曇らせず、
       ガラスらしさは「歪み（屈折）」が担う。skill のマテリアル定義のうち
       “ぼかした半透明レイヤー” は、文字を載せるパネル側にだけ残す
       （パネルは可読性が要る面なので薄く曇らせる＝skill の material weight の使い分け）。 */
    --glass-tint: rgba(10, 13, 26, 0.07);    /* タイルの地色。ほぼ素通し */
    --glass-sat: 1.12;                       /* 屈折後の彩度をわずかに上げる（ガラスの色乗り） */
    /* 歪みの強さは CSS ではなく JS 側の物理パラメータ（ベベル幅・厚み・屈折率）で決まる。
       initLens の BEZEL / THICK / IOR を触ること。 */
    --glass-blur-panel: 14px;                /* パネルだけぼかす */
    --glass-tint-panel: rgba(9, 12, 24, 0.34);
    --edge-top: rgba(255, 255, 255, 0.40);   /* 光を受ける上縁（skill の bright top edge） */
    --edge-bottom: rgba(255, 255, 255, 0.10);

    /* --- イージング（emil: 組み込みイージングは弱すぎる。必ず自前カーブ） --- */
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { overflow: hidden; height: 100%; background: transparent; }
  body {
    display: flex; flex-direction: column; justify-content: flex-end;
    /* skill §15: まずプラットフォームの標準フォント（字幅・トラッキング調整済み）を使う */
    font-family: system-ui, "Yu Gothic UI", sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* 背後の実画素（python の背後サンプラが窓の矩形をそのまま送ってくる）。
     窓全体に 1:1 で敷くので、タイルもパネルも同じ景色の上に乗る＝ズレない。
     旧版はこれを #tile の中に置いて object-fit: cover していたため、
     パネル展開時に背景が縦に潰れていた（v4 で解消）。 */
  #backdrop { position: fixed; inset: 0; z-index: 0; display: none; }
  body.acrylic #backdrop { display: block; }
  #backdrop img { width: 100%; height: 100%; object-fit: fill; display: block; }

  /* ===== 履歴パネル（タイルの上に展開）=====
     大きい面なので厚いマテリアル（blur 22px）。skill:「Bigger surfaces should read as thicker」。
     開閉は「materialize（ぼけ＋スケール＋不透明度を同時に動かす）」——単なるフェードにしない。 */
  #panel {
    display: none; height: 308px;
    border-radius: var(--radius) var(--radius) 0 0;
    flex-direction: column; overflow: hidden; position: relative; z-index: 1;
    opacity: 0; transform: scale(.97) translateY(6px); filter: blur(10px);
    transform-origin: bottom center;   /* 出所＝下のタイルから立ち上がる */
    transition: opacity 150ms var(--ease-out), transform 150ms var(--ease-out),
                filter 150ms var(--ease-out);   /* 閉じは速く（emil: exit は enter より速く） */
  }
  body.expanded #panel {
    opacity: 1; transform: none; filter: none;
    transition-duration: 220ms;        /* 開きは 220ms（skill: ドロワーは 150〜250ms） */
  }
  body.acrylic #panel {
    background: var(--glass-tint-panel);
    -webkit-backdrop-filter: blur(var(--glass-blur-panel)) saturate(var(--glass-sat));
            backdrop-filter: blur(var(--glass-blur-panel)) saturate(var(--glass-sat));
    box-shadow: inset 0 1px 0 var(--edge-top);   /* 光を受ける上縁 */
  }
  body.solid  #panel { background: linear-gradient(180deg, #141a2e, #0b0e1c);
                       box-shadow: inset 0 1px 0 var(--edge-top); }
  #panel header {
    padding: 10px 14px 8px; font-size: 9.5px; letter-spacing: .16em;
    color: var(--text-dim); font-family: "Cascadia Code", monospace;
  }
  /* skill:「Scroll edge effects, not hard dividers」——ヘッダ下の 1px 罫線をやめ、
     リストが浮遊クロームに潜り込む上下端をマスクでフェードさせる */
  #hist { flex: 1; overflow-y: auto; padding: 4px;
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 12px,
                                        #000 calc(100% - 8px), transparent 100%);
            mask-image: linear-gradient(180deg, transparent 0, #000 12px,
                                        #000 calc(100% - 8px), transparent 100%);
  }
  #hist::-webkit-scrollbar { width: 4px; }
  #hist::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 2px; }
  .item { padding: 6px 9px; border-radius: 9px; margin: 2px 3px; cursor: pointer;
          transition: background 150ms ease; }
  .item .meta { font-family: "Cascadia Code", monospace; font-size: 9px;
                color: var(--text-dim); margin-bottom: 2px; display: flex; gap: 7px; }
  .item .meta .mode-dict { color: #5eead4; }
  .item .meta .mode-talk { color: #93b4ff; }
  .item .body { font-size: 10.5px; line-height: 1.5; color: var(--text);
                user-select: text; word-break: break-all; }
  .empty { text-align: center; color: var(--text-dim); font-size: 10.5px; padding: 34px 0; }

  /* ===== 正方形グラスタイル（本体）=====
     小さく浮く操作面なので薄いマテリアル（blur 14px）。
     上縁を明るく・下縁を弱く＝skill の「bright top edge = light catching the material」。
     縁の線（border）は張らない。マテリアルの明暗そのものが境界を語る。 */
  #tile {
    position: relative; flex: 0 0 auto; z-index: 1;
    width: 100%; height: 116px;
    border-radius: var(--radius);
    overflow: hidden;
  }
  body.expanded #tile { border-radius: 0 0 var(--radius) var(--radius); }
  /* --- 厚いガラス板そのもの ---
     #tilebd = タイルと同じ大きさの箱に、窓全体の背後画像を「窓の下端に合わせて」置いたもの。
     こうするとタイルの下に実際にある景色と 1:1 で一致する（パネル展開時もズレない）。
     その箱に屈折フィルタを掛けるので、歪みの分布（squircle 距離場）がタイルの形と一致する。
     サンプリングは常に内向き＝箱の外を参照しないので、縁が破綻しない。 */
  /* overflow は切らない: 屈折で「タイルの少し外」を参照するため、フィルタに渡す絵は
     タイルより広いままにしておく必要がある（最終的な切り抜きは #tile の overflow が行う）。
     画像は拡大しない＝**中心は背景が 1:1 でそのまま透ける**（まひろ指示）。 */
  #tilebd { position: absolute; inset: 0; z-index: 0; display: none;
            filter: url(#lens) saturate(var(--glass-sat)); }
  body.acrylic #tilebd { display: block; }
  #tilebd img { position: absolute; left: 0; bottom: 0; width: 100%; height: 100vh;
                object-fit: fill; display: block; }
  #tile::before {   /* ガラスの地色。ほぼ透明——濃くしたいときは --glass-tint の alpha を上げる */
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: transparent;
  }
  body.acrylic #tile::before { background: var(--glass-tint); }
  /* 不透明フォールバック（背後サンプラが死んだとき）: 同じ色味を自前で描く */
  body.solid #tile {
    background:
      radial-gradient(120% 90% at 50% -12%, rgba(255,255,255,.085), transparent 55%),
      radial-gradient(110% 110% at 50% 46%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 62%),
      radial-gradient(150% 130% at 18% 4%, #1b2340, #0c101f 58%, #090b15);
  }
  #tile::after {   /* 光を受ける縁。上が明るく下は弱い＝斜め上からの光の当たり方 */
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
    border-radius: inherit;
    box-shadow: inset 0 1px 0 var(--edge-top), inset 0 -1px 0 var(--edge-bottom);
  }
  body.expanded #tile::after { box-shadow: inset 0 -1px 0 var(--edge-bottom); }

  #orb { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 2;
         /* レンズアイ本体。バレルの落ち影だけ薄く（gooフィルタは旧磁性流体用＝不使用） */
         filter: drop-shadow(0 3px 7px rgba(0,0,0,.32)); }
  #gloss { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 2;
           pointer-events: none; }

  /* ===== 文字（下部・小さく） ===== */
  /* ヴァイブランシー（apple-design skill §12/§15）: 変化する背景の上では、
     薄いグレー＋大きな黒ハローではなく「白寄りの高コントラスト・やや太字・小さめの字間広げ」で読ませる。
     影は〈密着した硬い影〉＋〈広く薄い影〉の二段——1本の大きなボケ影より輪郭が濁らない。 */
  #label {
    position: absolute; left: 8px; right: 8px; bottom: 7px; z-index: 5;
    text-align: center; font-size: 10px; letter-spacing: .04em; font-weight: 500;
    color: #f4f7ff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 0 2px rgba(0,0,0,.72), 0 1px 1px rgba(0,0,0,.70),
                 0 0 7px rgba(0,0,0,.55), 0 0 15px rgba(0,0,0,.32);
    pointer-events: none;
  }

  /* ===== 下書きバッジ（左上・クリックで全消し） =====
     skill:「Put color on a solid layer, not the translucent foreground」——
     色を持つ要素は半透明のマテリアルに溶かさず、不透明な面に乗せる。 */
  #badge {
    position: absolute; top: 6px; left: 6px; display: none; z-index: 6;
    font-size: 8.5px; padding: 2px 7px; border-radius: 9px;
    color: #fff; font-weight: 500; letter-spacing: .02em;
    background: color-mix(in srgb, var(--accent) 92%, #05070f);
    cursor: pointer;
    transition: background 150ms ease, color 150ms ease, transform 130ms var(--ease-out);
  }
  #badge:active { transform: scale(.97); }   /* 押したら必ず何か返す（emil） */

  /* ===== ボタン（右上・ホバーで出現） ===== */
  #btns {
    position: absolute; top: 6px; right: 6px; z-index: 6;
    display: flex; gap: 4px;
    opacity: 0; transform: translateY(-4px);
    transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out);
  }
  .btn {
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10.5px; cursor: pointer; color: var(--text-dim);
    background: rgba(16, 20, 38, .55);
    border: 1px solid rgba(255,255,255,.14);
    transition: background 150ms ease, color 150ms ease, border-color 150ms ease,
                transform 130ms var(--ease-out);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .btn:active { transform: scale(.94); }   /* 反応は押した瞬間に返す */
  /* タッチ端末では tap が hover を誤発火させるので、ホバー演出はこのクエリで囲う（emil） */
  @media (hover: hover) and (pointer: fine) {
    #tile:hover #btns { opacity: 1; transform: none; }
    .btn:hover { color: #fff; background: rgba(255,255,255,.16); transform: scale(1.1); }
    #btn-close:hover { color: #ff8da3; border-color: rgba(255,141,163,.5); }
    #badge:hover { background: #c1436a; color: #fff; }
    .item:hover { background: rgba(255,255,255,.06); }
  }

  /* ===== OS のアクセシビリティ設定を尊重（apple-design skill §14） ===== */
  @media (prefers-reduced-transparency: reduce) {
    /* 透過を弱める設定なら、マテリアルを曇らせ不透明側に倒す（skill の指定どおり） */
    body.acrylic #tilebd { display: none; }          /* 歪んだ素通しをやめて不透明にする */
    body.acrylic #tile::before { background: rgba(9, 12, 24, .88); }
    body.acrylic #panel  { background: rgba(9, 12, 24, .94);
                           -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
  @media (prefers-contrast: more) {
    :root { --glass-tint: rgba(6, 8, 16, .78); --edge-top: rgba(255,255,255,.6); }
    #label { color: #fff; font-weight: 600;
             text-shadow: 0 1px 2px #000, 0 0 6px rgba(0,0,0,.95); }
  }
  @media (prefers-reduced-motion: reduce) {
    /* 動きは消すが不透明度の変化は残す（skill: gentler equivalent であって zero ではない） */
    #panel { transition: opacity 200ms ease; transform: none !important; filter: none !important; }
    .item, .btn, #btns, #badge { transition: opacity 150ms ease; transform: none !important; }
  }
</style>
</head>
<body class="solid">
  <div id="panel">
    <header>RECOGNITION LOG</header>
    <div id="hist"></div>
  </div>

  <!-- 背後の実画素（python の背後サンプラが窓の矩形をそのまま送る）。窓全体に 1:1 で敷く。
       パネルはこれを backdrop-filter でぼかし、タイルは #tilebd 側で屈折させる。 -->
  <div id="backdrop"><img id="bdimg" alt=""></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <!-- 厚ガラスの屈折。変位マップは JS が squircle（角丸矩形）の距離場として焼く:
         中心は無変位、縁に近づくほど外向き法線方向へ急増し、内向きにサンプリングする
         （＝縁が内側の景色を折り込む。箱の外を参照しないので破綻しない）。 -->
    <!-- 領域は必ず余白付き（0%/100% にすると feImage のサブ領域が解決されず変位マップが
         空になり、タイルが真っ暗になる。実測で確認）。外向きに最大14pxほど参照するので
         タイル(116px)の 12% 以上の余白を取る。scale と href は JS が焼いて入れる。 -->
    <filter id="lens" x="-15%" y="-15%" width="130%" height="130%"
            color-interpolation-filters="sRGB">
      <!-- サブ領域は指定しない＝フィルタ領域そのもの（％指定は SVG のビューポート基準で
           解決され 0 になり得るため、ここで座標を書かないのが唯一確実）。
           JS はこの拡張領域と同じ縦横比・同じ原点でマップを焼く。 -->
      <feImage id="lensmap" preserveAspectRatio="none" result="map"/>
      <feDisplacementMap in="SourceGraphic" in2="map" scale="0"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs></svg>

  <div id="tile" class="pywebview-drag-region">
    <div id="tilebd"><img id="bdtile" alt=""></div>
    <canvas id="orb"></canvas>
    <canvas id="gloss"></canvas>
    <div id="label" class="pywebview-drag-region">待機中</div>
    <div id="badge" title="クリックで下書きを全部消す"></div>
    <div id="btns">
      <div class="btn" id="btn-hist" title="認識ログ">≡</div>
      <div class="btn" id="btn-dash" title="ダッシュボード">◎</div>
      <div class="btn" id="btn-close" title="閉じる / 録音キャンセル">✕</div>
    </div>
  </div>

<script>
/* ================= レンズアイ（HAL 9000系のメカニカル・アイ） =================
   まひろ指定（2026-07-18）: 磁性流体を退役（web/bar_ferrofluid_backup.html に退避）し、
   「カメラレンズ型の目」へ。レンズらしさをしっかり＝金属バレル＋同心リング＋
   ガラスドームのスペキュラ。中心の光彩は球体っぽいグラデの核で、
   **瞳孔（と光彩の開き）が音声レベルで拡大縮小**。
   - 待機/対話: 機械シャッターの瞬き（ランダム間隔・たまに二度瞬き）
   - 認識/処理中: 光彩内をスキャンアークが周回
   - 発話中: 拍でやわらかく明滅
   まひろ指定（2026-07-19）:
   - 縁＝**カメラレンズのベゼル**をちゃんと作る（マシンドメタル環＋ローレット刻み＋
     溝＋内向き斜面＋口金リングの多段構造）
   - **色を持つのは中心のAIコア球だけ**（「その周りににじんで青が出てるのは消して・
     中心の玉だけ色がついてる感じに」）。旧・光彩の色面と広域ブルームは撤去し、
     レンズ内部は無彩色の素子（白い細線のみ）に。旧 eye_skin は pupil_color へ一本化。
   - コア球の色は config [ui] pupil_color（poll の cur.pupil）＝**ダッシュボードから変更可**。
     16進色（既定 青#4fa8f5）または "rainbow"（ユニコーン虹コア）
   大きさ: レンズ外径 = R0 = タイル幅の31% → 直径がタイルの約6割 */
const cv = document.getElementById("orb");
const ctx = cv.getContext("2d");
const gcv = document.getElementById("gloss");
const gtx = gcv.getContext("2d");

const TAU = Math.PI * 2;
let W = 116, H = 116, CX = 58, CY = 52, R0 = 35;  /* fitCanvas が実寸から再計算 */

/* 状態ごとの挙動（open=光彩の基礎開度, react=声への感度, scan=処理スキャン, blink=瞬き許可） */
const MODES = {
  idle:         { open: .50, react: .35, scan: 0,   bright: .70, blink: 1, fps: 30 },
  loading:      { open: .60, react: .20, scan: 1.0, bright: .80, blink: 0, fps: 60 },
  booting:      { open: .60, react: .20, scan: 1.0, bright: .80, blink: 0, fps: 60 },
  transcribing: { open: .70, react: .25, scan: 1.7, bright: .95, blink: 0, fps: 60 },
  dictate_proc: { open: .70, react: .25, scan: 1.7, bright: .95, blink: 0, fps: 60 },
  recording:    { open: .92, react: 1.0, scan: 0,   bright: 1.05, blink: 0, fps: 60 },
  dictating:    { open: .92, react: 1.0, scan: 0,   bright: 1.05, blink: 0, fps: 60 },
  active:       { open: .68, react: .55, scan: 0,   bright: .85, blink: 1, fps: 30 },
  speaking:     { open: .76, react: .20, scan: 0,   bright: 1.0,  blink: 0, fps: 60, pulse: .5, hz: 2.2 },
  error:        { open: .28, react: 0,   scan: 0,   bright: .55, blink: 0, fps: 30 },
};

let cur = { key: "idle", accent: "#565f89", label: "待機中", pending: 0, level: 0,
            glass: false, fluid: "#0b0d14", pupil: "#4fa8f5" };
let smooth = 0, lastFrame = 0;
let scanPhase = Math.random() * 9;          /* 処理スキャンアークの周回位相 */
let blinkStart = -9, nextBlink = 2 + Math.random() * 3;   /* 機械シャッター瞬き */

/* --- 調整ノブ（一箇所に集約） --- */
const CORE_MIN = 0.17, CORE_MAX = 0.17;  /* コア球半径 = RL×(MIN + MAX×lvl)＝声で拡縮 */
const CORE_GLOW = 1.45;   /* コア球の接触グロー半径（×Rp）。上げるほど周囲へにじむ */

/* 虹コア（pupil_color = "rainbow"）: まひろが気に入っていたユニコーン虹をコア球に継承 */
const RAINBOW = [[0, "#ffb0dc"], [0.2, "#d3aaff"], [0.4, "#a8d4ff"],
                 [0.6, "#9df3d8"], [0.8, "#ffe1a8"], [1, "#ffb0dc"]];

/* コア球パレット: config [ui] pupil_color の1色から「白コア→色→深色」のグラデを導出。
   色が変わったときだけ再計算（毎フレームのパースを避ける） */
let pupilPal = null, pupilKey = "";
function hexRgb(h) {
  const v = parseInt(String(h).replace("#", ""), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}
function mixc(a, b, k) {
  return [Math.round(a[0] + (b[0] - a[0]) * k),
          Math.round(a[1] + (b[1] - a[1]) * k),
          Math.round(a[2] + (b[2] - a[2]) * k)];
}
const rgbs = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function getPupilPal() {
  const key = String(cur.pupil || "#4fa8f5").trim().toLowerCase();
  if (key !== pupilKey) {
    const WHITE = [255, 255, 255], DARK = [3, 5, 12];
    if (key === "rainbow" || key === "unicorn") {
      pupilPal = { rainbow: true, mid: [255, 255, 255], glow: [232, 206, 255] };
    } else {
      let c = hexRgb(key);
      if (c.some(Number.isNaN)) c = [79, 168, 245];   /* 不正値は既定の青 */
      pupilPal = { rainbow: false, core: WHITE, mid: mixc(c, WHITE, 0.55), base: c,
                   deep: mixc(c, DARK, 0.52), glow: c };
    }
    pupilKey = key;
  }
  return pupilPal;
}

/* キャンバスを実ピクセルに合わせ、タイル実寸から流体ジオメトリを再計算 */
let dpr = 1;
function fitCanvas() {
  const r = cv.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  CX = W / 2;
  CY = H / 2 - Math.max(6, H * 0.055);   /* ラベル分わずかに上 */
  R0 = W * 0.31;   /* レンズ外径。ベゼルの分わずかに拡大（2026-07-19） */
  for (const c of [cv, gcv]) {
    const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  }
}
fitCanvas();
window.addEventListener("resize", fitCanvas);
/* 光沢キャンバスは旧磁性流体用＝レンズアイでは未使用（一度だけ消す） */
gtx.setTransform(1, 0, 0, 1, 0, 0);
gtx.clearRect(0, 0, gcv.width, gcv.height);

function circle(c, x, y, r) {
  c.beginPath();
  c.arc(x, y, r, 0, TAU);
  c.fill();
}

function drawOrb(now, dt) {
  const P = MODES[cur.key] || MODES.idle;

  /* fps 制御: 静かな対話中は 30fps に落として CPU を返す */
  const budget = 1000 / (P.fps === 30 && smooth < 0.06 ? 30 : 60);
  if (now - lastFrame < budget - 2) return;
  lastFrame = now;
  const t = now / 1000;

  const hot = cur.key === "recording" || cur.key === "dictating";
  const target = Math.min(1, cur.level * (hot ? 1.7 : 0.8));
  smooth += (target - smooth) * (target > smooth ? 0.5 : 0.08);
  const pulse = P.pulse ? (0.5 + 0.5 * Math.sin(t * (P.hz || 2) * TAU)) * P.pulse : 0;
  /* lvl = 目の総合的な「開き・輝き」0..1（瞳孔拡縮の主入力） */
  const lvl = Math.min(1, P.open * 0.55 + smooth * (P.react || 0) + pulse * 0.55);
  scanPhase += dt * (0.8 + (P.scan || 0) * 3.2);

  /* 機械シャッターの瞬き（blink 許可モードのみ・ランダム間隔・2割で二度瞬き） */
  let blinkK = 0;
  if (P.blink && t > nextBlink && blinkStart < 0) blinkStart = t;
  if (blinkStart >= 0) {
    const ph = (t - blinkStart) / 0.26;
    if (ph >= 1) {
      blinkStart = -9;
      nextBlink = t + (Math.random() < 0.2 ? 0.25 : 2.8 + Math.random() * 4.5);
    } else {
      let k = ph < 0.45 ? ph / 0.45 : (1 - ph) / 0.55;
      blinkK = k * k * (3 - 2 * k);   /* smoothstep */
    }
  }
  const aperture = 1 - 0.96 * blinkK;   /* 1=全開 → 瞬きでほぼ全閉 */

  const RL = R0;                       /* レンズ外径 */
  const RD = RL * 0.76;                /* ガラスドーム径（ベゼルを太らせた 2026-07-19） */
  const Rp = RL * (CORE_MIN + CORE_MAX * lvl);   /* AIコア球＝声で拡大縮小（音声反応の主役） */
  const e = Math.min(1, lvl) * P.bright;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  /* --- 外周の状態グロー（accent 色＝いまのモードが分かる） --- */
  const av = parseInt((cur.accent || "#565f89").slice(1), 16);
  const ar = (av >> 16) & 255, ag = (av >> 8) & 255, ab = av & 255;
  const halo = ctx.createRadialGradient(CX, CY, RL * 0.9, CX, CY, RL * 1.45);
  halo.addColorStop(0, `rgba(${ar},${ag},${ab},${0.10 + 0.14 * e})`);
  halo.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = halo;
  ctx.fillRect(CX - RL * 1.5, CY - RL * 1.5, RL * 3, RL * 3);

  /* --- カメラレンズのベゼル（まひろ指定 2026-07-19「カメラのレンズみたいに縁を」）:
     外周ベベル光 → マシンドメタル環（conic旋盤目＋ローレット刻み）→ 溝 →
     内向き斜面（奥へ落ちる筒）→ 口金リング → ドーム、の多段構造 --- */
  const met = ctx.createConicGradient(-0.5, CX, CY);   /* 旋盤目＝周方向の明暗ゆらぎ */
  for (let i = 0; i <= 48; i++) {
    const s = i / 48;
    const lum = 0.30 + 0.22 * Math.sin(s * TAU * 2 - 1.2) + 0.10 * Math.sin(s * TAU * 7 + 0.7);
    const v = Math.round(34 + 46 * Math.max(0, lum));
    met.addColorStop(s, `rgb(${v},${v + 4},${v + 12})`);
  }
  ctx.fillStyle = met;
  circle(ctx, CX, CY, RL);
  const shade = ctx.createLinearGradient(CX, CY - RL, CX, CY + RL);   /* 共通の上方光 */
  shade.addColorStop(0, "rgba(255,255,255,.18)");
  shade.addColorStop(0.35, "rgba(255,255,255,0)");
  shade.addColorStop(0.85, "rgba(0,0,0,.30)");
  shade.addColorStop(1, "rgba(0,0,0,.12)");
  ctx.fillStyle = shade;
  circle(ctx, CX, CY, RL);
  ctx.strokeStyle = "rgba(0,0,0,.28)";   /* ローレット（グリップの刻み） */
  ctx.lineWidth = 1;
  for (let i = 0; i < 56; i++) {
    const a2 = (i / 56) * TAU;
    ctx.beginPath();
    ctx.moveTo(CX + Math.cos(a2) * RL * 0.985, CY + Math.sin(a2) * RL * 0.985);
    ctx.lineTo(CX + Math.cos(a2) * RL * 0.905, CY + Math.sin(a2) * RL * 0.905);
    ctx.stroke();
  }
  const bevel = ctx.createLinearGradient(CX, CY - RL, CX, CY + RL);   /* 外縁のベベル光 */
  bevel.addColorStop(0, "rgba(255,255,255,.50)");
  bevel.addColorStop(0.5, "rgba(255,255,255,.10)");
  bevel.addColorStop(1, "rgba(255,255,255,.26)");
  ctx.strokeStyle = bevel;
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(CX, CY, RL - 0.7, 0, TAU); ctx.stroke();
  ctx.strokeStyle = "rgba(0,0,0,.55)";   /* 溝（メタル環と斜面の境） */
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(CX, CY, RL * 0.895, 0, TAU); ctx.stroke();
  const slope = ctx.createLinearGradient(CX, CY - RL, CX, CY + RL);   /* 逆光＝奥へ落ちる斜面 */
  slope.addColorStop(0, "#0f131c");
  slope.addColorStop(0.6, "#1b212d");
  slope.addColorStop(1, "#2b3342");
  ctx.fillStyle = slope;
  circle(ctx, CX, CY, RL * 0.885);
  ctx.strokeStyle = "rgba(255,255,255,.10)";   /* 口金リング（ドーム手前の細環） */
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(CX, CY, RD + 1.8, 0, TAU); ctx.stroke();
  ctx.strokeStyle = "rgba(0,0,0,.65)";
  ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(CX, CY, RD + 0.5, 0, TAU); ctx.stroke();

  /* --- ガラスドームの底（暗い筒の奥） --- */
  const dome = ctx.createRadialGradient(CX - RD * 0.2, CY - RD * 0.25, RD * 0.1, CX, CY, RD);
  dome.addColorStop(0, "#101624");
  dome.addColorStop(0.7, "#070a12");
  dome.addColorStop(1, "#04060b");
  ctx.fillStyle = dome;
  circle(ctx, CX, CY, RD);

  /* --- レンズ内部（無彩色）＋中心のAIコア球: シャッター開度 aperture でクリップ＝機械瞬き
     まひろ指定 2026-07-19「中心の玉だけ色がついてる感じに・周りのにじみは消して」:
     光彩の色面と広域ブルームを撤去し、内部は素通しの暗いレンズ素子（白の細い光だけ）に。
     色を持つのは中心のコア球ひとつだけ（HAL 9000 の構図そのもの） --- */
  const A = RD * 1.02 * aperture;
  if (A > 0.5) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(CX, CY, A, 0, TAU);
    ctx.clip();

    /* 内部レンズ素子の同心リング（無彩色＝奥行きだけを足す） */
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(255,255,255,.075)";
    ctx.beginPath(); ctx.arc(CX, CY, RD * 0.72, 0, TAU); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.045)";
    ctx.beginPath(); ctx.arc(CX, CY, RD * 0.47, 0, TAU); ctx.stroke();

    /* 絞り羽根の放射スジ（ごく淡い白＝質感のみ。色は持たせない） */
    ctx.strokeStyle = "rgba(255,255,255,.05)";
    for (let i = 0; i < 36; i++) {
      const a2 = (i / 36) * TAU + t * 0.03;
      ctx.beginPath();
      ctx.moveTo(CX + Math.cos(a2) * RD * 0.30, CY + Math.sin(a2) * RD * 0.30);
      ctx.lineTo(CX + Math.cos(a2) * RD * 0.93, CY + Math.sin(a2) * RD * 0.93);
      ctx.stroke();
    }

    /* 処理中スキャン: レンズ内を周回する明アーク＋残像（白） */
    if (P.scan) {
      const rs = RD * 0.60;
      ctx.lineCap = "round";
      for (let k = 0; k < 3; k++) {
        ctx.strokeStyle = `rgba(255,255,255,${0.55 / (k + 1)})`;
        ctx.lineWidth = 2.4 - k * 0.6;
        ctx.beginPath();
        ctx.arc(CX, CY, rs, scanPhase * 2.2 - k * 0.5, scanPhase * 2.2 - k * 0.5 + 0.9);
        ctx.stroke();
      }
    }

    /* --- AIコア球（この目で唯一の色。config [ui] pupil_color / dashboardから変更可） --- */
    const pp = getPupilPal();
    const gr = Rp * CORE_GLOW;   /* 接触グローだけ＝周囲へ広くにじませない */
    const pglow = ctx.createRadialGradient(CX, CY, Rp * 0.92, CX, CY, gr);
    pglow.addColorStop(0, rgbs(pp.glow, 0.30 + 0.22 * e));
    pglow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = pglow;
    circle(ctx, CX, CY, gr);

    if (pp.rainbow) {            /* 虹コア: 回転する conic ＋ 白コアで球体に */
      const cg = ctx.createConicGradient(t * 0.3, CX, CY);
      for (const [s, c] of RAINBOW) cg.addColorStop(s, c);
      ctx.fillStyle = cg;
      circle(ctx, CX, CY, Rp);
      const core = ctx.createRadialGradient(CX - Rp * 0.24, CY - Rp * 0.28, 0, CX, CY, Rp);
      core.addColorStop(0, "rgba(255,255,255,.80)");
      core.addColorStop(0.38, "rgba(255,255,255,.06)");
      core.addColorStop(1, "rgba(70,50,105,.52)");
      ctx.fillStyle = core;
      circle(ctx, CX, CY, Rp);
    } else {
      const pup = ctx.createRadialGradient(CX - Rp * 0.24, CY - Rp * 0.28, 0, CX, CY, Rp);
      pup.addColorStop(0, rgbs(pp.core, 1));    /* 白コア（上左寄り＝球体のハイライト） */
      pup.addColorStop(0.32, rgbs(pp.mid, 1));
      pup.addColorStop(0.76, rgbs(pp.base, 1));
      pup.addColorStop(1, rgbs(pp.deep, 1));    /* 縁は深色＝球の落ち際 */
      ctx.fillStyle = pup;
      circle(ctx, CX, CY, Rp);
    }
    ctx.strokeStyle = rgbs(pp.mid, 0.30 + 0.30 * e);   /* 球の縁の明環 */
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(CX, CY, Rp - 0.5, 0, TAU); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.72)";           /* ガラス球のハイライト点 */
    circle(ctx, CX - Rp * 0.36, CY - Rp * 0.40, Rp * 0.17);
    ctx.restore();
  }

  /* --- ドームのガラス反射（スペキュラ）: レンズらしさの決め手 --- */
  const g1 = ctx.createRadialGradient(
    CX - RD * 0.38, CY - RD * 0.44, 0, CX - RD * 0.38, CY - RD * 0.44, RD * 0.34);
  g1.addColorStop(0, "rgba(255,255,255,.85)");
  g1.addColorStop(0.35, "rgba(255,255,255,.28)");
  g1.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = g1;
  circle(ctx, CX - RD * 0.38, CY - RD * 0.44, RD * 0.34);
  ctx.strokeStyle = "rgba(255,255,255,.20)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(CX, CY, RD * 0.86, TAU * 0.08, TAU * 0.22);   /* 右下の弧リフレクション */
  ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,.10)";
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.arc(CX, CY, RD * 0.70, TAU * 0.55, TAU * 0.66);   /* 左上の副次弧 */
  ctx.stroke();
}

let last = performance.now();
(function loop(now) {
  if (!document.hidden) drawOrb(now, Math.min(0.05, (now - last) / 1000));
  last = now;
  requestAnimationFrame(loop);
})(last);

/* ================= ガラスの屈折（スネルの法則で導出）=================
   まひろ指摘（2026-08-06）「自分たちの適当な値でやるな。ちゃんとガラスらしい歪みに」を受け、
   経験則のカーブをやめて **実際の光学** から変位を計算する。
   出典: kube.io "Liquid Glass in the Browser: Refraction with CSS and SVG"
   （https://kube.io/blog/liquid-glass-css-svg/）の導出をそのまま実装:
     1. ガラスの断面プロファイル（縁のベベル）を squircle 凸面 y = ⁴√(1-(1-x)⁴) で置く
        ——記事が「円弧より遷移が滑らかで屈折の勾配が素直」として採っている面
     2. その微分から法線の傾き θ₁ を出す
     3. スネルの法則 n₁sinθ₁ = n₂sinθ₂（n₁=1 空気, n₂=1.5 ガラス）で屈折角 θ₂
     4. 厚み THICK を通る間の横ずれ = THICK × tan(θ₁-θ₂) を、角丸矩形SDFの
        **外向き法線**方向へ適用（＝縁の外側の景色が縁に寄って見える。実物のガラスの縁の見え方）
     5. 記事の符号化どおり r = 128 + x·127 / g = 128 + y·127 に正規化して焼き、
        feDisplacementMap の scale に最大変位[px]を渡す
   中心（ベベルの内側）は法線が真上＝変位ゼロ＝**背景が完全に素通し**のまま。
   ベベル幅・厚み・屈折率が唯一のノブで、どれも物理的に意味のある量になっている。 */
(function initLens() {
  const IOR = 1.5;      /* ガラスの屈折率（記事の既定 n₂=1.5） */
  const BEZEL = 13;     /* 縁のベベル幅[px]。ここだけが曲がる帯 */
  const THICK = 14;     /* ガラスの厚み[px]。横ずれ量に比例 */
  const RAD = 16;       /* 角丸半径[px]（CSS の --radius と一致させる） */
  const FADE = 2.5;     /* 最外周のこの幅[px]は変位を0へ戻す——タイルの外の画素は
                           サンプラが持っていないので、そこを参照すると透けて黒くなる */

  const tile = document.getElementById("tile");
  const r0 = tile.getBoundingClientRect();
  const W = Math.max(32, Math.round(r0.width || 116));
  const H = Math.max(32, Math.round(r0.height || 116));
  /* フィルタ領域は -15%/130%。マップも同じ広さで焼き、中央に実タイルを置く
     （feImage はサブ領域を指定していないのでフィルタ領域いっぱいに引き伸ばされる）。 */
  const PAD = 0.15;
  const MW = Math.round(W * (1 + PAD * 2)), MH = Math.round(H * (1 + PAD * 2));
  const OX = (MW - W) / 2, OY = (MH - H) / 2;

  /* 角丸矩形の符号付き距離（タイル中心原点・内側が負） */
  const sdf = (px, py) => {
    const qx = Math.abs(px) - W / 2 + RAD, qy = Math.abs(py) - H / 2 + RAD;
    return Math.hypot(Math.max(qx, 0), Math.max(qy, 0))
           + Math.min(Math.max(qx, qy), 0) - RAD;
  };
  const surf = (x) => Math.pow(1 - Math.pow(1 - x, 4), 0.25);   /* squircle 凸面 */

  const dxs = new Float32Array(MW * MH), dys = new Float32Array(MW * MH);
  let maxd = 1e-6;
  for (let y = 0; y < MH; y++) {
    for (let x = 0; x < MW; x++) {
      const px = x + 0.5 - OX - W / 2, py = y + 0.5 - OY - H / 2;
      const d = -sdf(px, py);                    /* 縁からの距離（内側が正） */
      if (d <= 0 || d >= BEZEL) continue;        /* 外側 or 平らな中心＝無変位 */
      const t = d / BEZEL;
      const slope = (surf(Math.min(1, t + 0.001)) - surf(Math.max(0, t - 0.001))) / 0.002;
      const th1 = Math.atan(slope);                                  /* 入射角 */
      const th2 = Math.asin(Math.min(1, Math.sin(th1) / IOR));       /* 屈折角 */
      let shift = THICK * Math.tan(th1 - th2);                       /* 横ずれ[px] */
      if (d < FADE) shift *= d / FADE;                               /* 最外周は戻す */
      const gx = (sdf(px + 0.5, py) - sdf(px - 0.5, py));            /* 外向き法線 */
      const gy = (sdf(px, py + 0.5) - sdf(px, py - 0.5));
      const gl = Math.hypot(gx, gy) || 1;
      const i = y * MW + x;
      dxs[i] = (gx / gl) * shift;
      dys[i] = (gy / gl) * shift;
      if (Math.abs(shift) > maxd) maxd = Math.abs(shift);
    }
  }
  const c = document.createElement("canvas");
  c.width = MW; c.height = MH;
  const g = c.getContext("2d");
  const im = g.createImageData(MW, MH);
  for (let i = 0; i < MW * MH; i++) {
    const o = i * 4;
    im.data[o] = 128 + (dxs[i] / maxd) * 127;
    im.data[o + 1] = 128 + (dys[i] / maxd) * 127;
    im.data[o + 2] = 128;
    im.data[o + 3] = 255;
  }
  g.putImageData(im, 0, 0);
  document.getElementById("lensmap").setAttribute("href", c.toDataURL());
  /* 正規化を戻す: 変位[px] = scale × (ch/255 - 0.5) なので scale = 最大変位 × 255/127 */
  document.querySelector("#lens feDisplacementMap")
          .setAttribute("scale", (maxd * 255 / 127).toFixed(2));
})();

/* 背後の実画素（python の背後サンプラが窓の矩形をそのまま JPEG で送ってくる）。
   #bdimg = 窓全体（パネルがぼかして使う） / #bdtile = タイルが屈折させて使う同じ絵 */
window.setBackdrop = (src) => {
  document.getElementById("bdimg").src = src;
  document.getElementById("bdtile").src = src;
};

/* ================= 状態ポーリング ================= */
const label = document.getElementById("label");
const badge = document.getElementById("badge");

/* DPIスケール合わせ: 現運用は scale=1.0 固定（非認識プロセス）。契約は維持 */
let appliedScale = 0;
function applyScale(sc) {
  if (sc && sc > 0 && Math.abs(sc - appliedScale) > 0.01) {
    document.documentElement.style.zoom = sc;
    appliedScale = sc;
  }
}

async function poll() {
  try {
    const s = await window.pywebview.api.poll();
    if (!s) return;
    applyScale(s.scale);
    cur = s;
    document.body.classList.toggle("acrylic", !!s.glass);
    document.body.classList.toggle("solid", !s.glass);
    document.documentElement.style.setProperty("--accent", s.accent);
    label.textContent = s.label;
    if (s.pending > 0) { badge.style.display = "block"; badge.textContent = `下書き ${s.pending}`; }
    else badge.style.display = "none";
  } catch (e) { /* bridge 未準備 */ }
}
setInterval(poll, 66);

document.getElementById("btn-close").addEventListener("click", () =>
  window.pywebview.api.close_clicked());
document.getElementById("badge").addEventListener("click", () =>
  window.pywebview.api.clear_pending());
document.getElementById("btn-dash").addEventListener("click", () =>
  window.pywebview.api.open_dashboard());
/* 履歴パネルの開閉。skill:「Materialize, don't just fade」——ぼけとスケールを同時に動かし、
   面が“materialize（出現）”して見えるようにする。CSS 側に transition を置き、
   ここは表示フラグと窓リサイズとの同期だけ持つ:
     開く: 先に窓を伸ばす要求を出す → 窓が実際に伸びた瞬間（resize）にアニメ開始
           （窓は python 側の監視ループが最大 120ms 遅れで伸ばすので、
            表示と同時にアニメを始めると見えないところで再生が終わってしまう）
     閉じる: アニメ（150ms・enter より速い）を先に流し、終わってから窓を縮める */
(function initPanel() {
  const panel = document.getElementById("panel");
  const body = document.body;
  let open = false, timer = 0;

  const onResize = () => {
    /* 窓が伸びた＝パネルの居場所ができた。ここで materialize を開始する */
    if (open && panel.style.display === "flex" && window.innerHeight > 200) {
      window.removeEventListener("resize", onResize);
      requestAnimationFrame(() => body.classList.add("expanded"));
    }
  };

  document.getElementById("btn-hist").addEventListener("click", async () => {
    clearTimeout(timer);
    open = !open;
    if (open) {
      panel.style.display = "flex";
      renderHistory();
      window.addEventListener("resize", onResize);
      timer = setTimeout(onResizeFallback, 450);   /* resize が来ない場合の保険 */
      await window.pywebview.api.set_expanded(true);
    } else {
      window.removeEventListener("resize", onResize);
      body.classList.remove("expanded");
      timer = setTimeout(async () => {             /* 消えてから窓を縮める */
        panel.style.display = "none";
        await window.pywebview.api.set_expanded(false);
      }, 160);
    }
  });

  function onResizeFallback() {
    if (open) { window.removeEventListener("resize", onResize); body.classList.add("expanded"); }
  }
})();

async function renderHistory() {
  const items = await window.pywebview.api.history();
  const el = document.getElementById("hist");
  if (!items.length) { el.innerHTML = '<div class="empty">まだ認識ログはないよ</div>'; return; }
  el.innerHTML = items.slice().reverse().map(([ts, mode, body]) => `
    <div class="item" title="クリックでコピー">
      <div class="meta"><span>${ts}</span>
        <span class="${mode.includes("文字") ? "mode-dict" : "mode-talk"}">[${mode}]</span></div>
      <div class="body">${body.replace(/</g, "&lt;")}</div>
    </div>`).join("");
  el.querySelectorAll(".item").forEach((it, i) => it.addEventListener("click", () =>
    window.pywebview.api.copy_text(items[items.length - 1 - i][2])));
}
setInterval(() => {
  if (document.getElementById("panel").style.display === "flex") renderHistory();
}, 1200);
</script>
